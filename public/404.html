<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 - ForesAi 开源镜像站</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="background"></div>
        
        <main class="main-content error-page">
            <div class="error-container">
                <div class="error-code">404</div>
                <div class="error-message">页面未找到</div>
                <div class="error-description">您访问的页面不存在或已被移除</div>
                
                <div class="redirect-info">
                    <div class="countdown">5</div>
                    <p>将在 <span id="countdown">5</span> 秒后自动跳转到首页</p>
                </div>

                <div class="action-buttons">
                    <a href="/" class="btn btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
                        </svg>
                        返回首页
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/>
                        </svg>
                        返回上一页
                    </a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>© <span id="current-year">2025</span> <a href="https://mirrors.foresai.com" target="_blank">ForesAi 开源镜像站</a></p>
        </footer>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
